# Gold Layer — Schema, Documentation & Tests

version: 2

models:
  # ─── Dimension: Customers ────────────────────────────────
  - name: dim_customers
    description: >
      Customer dimension with SCD Type 2 tracking, order metrics,
      and calculated lifetime value indicators.
    columns:
      - name: customer_key
        description: Surrogate key
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_state
        tests:
          - not_null
      - name: total_orders
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: total_spent
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  # ─── Dimension: Products ─────────────────────────────────
  - name: dim_products
    description: >
      Product dimension with category hierarchy, physical attributes,
      sales metrics, and review aggregations.
    columns:
      - name: product_key
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - unique
          - not_null
      - name: avg_review_score
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 5

  # ─── Dimension: Time ─────────────────────────────────────
  - name: dim_time
    description: >
      Date dimension with Brazilian holidays, fiscal periods,
      and day/week/month/quarter/year attributes.
    columns:
      - name: date_key
        tests:
          - unique
          - not_null
      - name: day_of_week
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 6

  # ─── Dimension: Sellers ──────────────────────────────────
  - name: dim_sellers
    description: Seller dimension with location and performance metrics.
    columns:
      - name: seller_key
        tests:
          - unique
          - not_null
      - name: seller_id
        tests:
          - unique
          - not_null

  # ─── Fact: Orders ────────────────────────────────────────
  - name: fact_orders
    description: >
      Order fact table at one-row-per-order grain.
      Measures: items, financials, delivery, reviews, profit margin.
    columns:
      - name: order_key
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_key
      - name: order_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_time')
              field: date_key
      - name: total_items
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: total_value
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: delivery_performance
        tests:
          - accepted_values:
              values: ["ON_TIME", "LATE", "PENDING"]

  # ─── Fact: Order Items ───────────────────────────────────
  - name: fact_order_items
    description: >
      Order item fact table at one-row-per-item grain.
      Bridges fact_orders to dim_products and dim_sellers.
      Enables product-level drill-through and basket analysis.
    columns:
      - name: order_item_key
        description: Surrogate key (order_id + order_item_id)
        tests:
          - unique
          - not_null
      - name: order_key
        tests:
          - not_null
          - relationships:
              to: ref('fact_orders')
              field: order_key
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_key
      - name: seller_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_sellers')
              field: seller_key
      - name: order_date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_time')
              field: date_key
      - name: price
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: total_item_value
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
