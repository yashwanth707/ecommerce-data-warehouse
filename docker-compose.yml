# Docker Compose — Local Development Environment
# Services:
#   - PostgreSQL (Airflow metadata database)
#   - Redis (Celery broker)
#   - Airflow Webserver
#   - Airflow Scheduler
#   - Airflow Worker (Celery)

version: "3.8"

x-airflow-common: &airflow-common
  build: .
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    # Snowflake credentials (passed through to DAGs)
    SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
    SNOWFLAKE_USER: ${SNOWFLAKE_USER}
    SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
    SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-SYSADMIN}
    SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-ECOMMERCE_WH}
    SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-ECOMMERCE_DW}
    # AWS credentials
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_REGION: ${AWS_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:-ecommerce-raw-data}
    S3_PREFIX: ${S3_PREFIX:-olist/}
    # Slack
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  volumes:
    - ./src/airflow/dags:/opt/airflow/dags
    - ./src/airflow/plugins:/opt/airflow/plugins
    - ./src/dbt:/opt/airflow/dbt
    - ./src/ingestion:/opt/airflow/ingestion
    - ./src/snowpark:/opt/airflow/snowpark
    - ./logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - ecommerce-net


services:
  # PostgreSQL — Airflow Metadata Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  # Redis — Celery Message Broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  # Airflow Init — Database migration & admin user creation
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    restart: "no"

  # Airflow Webserver
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 300s
    restart: always
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  # Airflow Scheduler
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 300s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  # Airflow Celery Worker
  airflow-worker:
    <<: *airflow-common
    command: celery worker
    restart: always
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  # Dashboard API — FastAPI Backend
  dashboard-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dashboard-api
    networks:
      - ecommerce-net
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - SNOWFLAKE_ACCOUNT=${SNOWFLAKE_ACCOUNT}
      - SNOWFLAKE_USER=${SNOWFLAKE_USER}
      - SNOWFLAKE_PASSWORD=${SNOWFLAKE_PASSWORD}
      - SNOWFLAKE_WAREHOUSE=${SNOWFLAKE_WAREHOUSE:-ECOMMERCE_WH}
      - SNOWFLAKE_DATABASE=${SNOWFLAKE_DATABASE:-ECOMMERCE_DW}
    volumes:
      - .:/app
    working_dir: /app
    command: python src/dashboard/dashboard_api.py

volumes:
  postgres-data:

networks:
  ecommerce-net:
    driver: bridge

