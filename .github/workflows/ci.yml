name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-mock
        # Install project requirements (skipping snowflake if it needs credentials)
        # For a basic CI, we just want to see if the syntax and basic units pass
        pip install decimal
    - name: Run Unit Tests
      run: |
        pytest tests/unit_tests/test_cost_monitor.py
